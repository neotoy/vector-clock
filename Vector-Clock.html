<script>
const LUNAR_CYCLE_DAYS = 29.530588853;
const NEW_MOON_JULIAN_DAY = 2451550.1;
const MILLISECONDS_PER_DAY = 86400000;
const MOON_PHASE_BOUNDS = [1.84566, 5.53699, 9.22831, 12.91963, 16.61096, 20.30228, 23.99361, 27.68493];
const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
const DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

function getSunTimes(latitude, longitude, date = new Date()) {
    if (!Number.isFinite(latitude) || Math.abs(latitude) > 90 ||
        !Number.isFinite(longitude) || Math.abs(longitude) > 180) {
        throw new RangeError("Latitude and longitude must be valid coordinates.");
    }

    const radiansPerDegree = Math.PI / 180;
    const degreesPerRadian = 180 / Math.PI;
    const dayOfYear = Math.floor(
        (Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) -
            Date.UTC(date.getFullYear(), 0, 0)) / MILLISECONDS_PER_DAY
    );
    const longitudeHour = longitude / 15;

    function calculate(isSunrise) {
        const approximateTime = dayOfYear + ((isSunrise ? 6 : 18) - longitudeHour) / 24;
        const meanAnomaly = 0.9856 * approximateTime - 3.289;
        const trueLongitude = (meanAnomaly +
            1.916 * Math.sin(meanAnomaly * radiansPerDegree) +
            0.020 * Math.sin(2 * meanAnomaly * radiansPerDegree) +
            282.634 + 360) % 360;
        let rightAscension = degreesPerRadian * Math.atan(0.91764 * Math.tan(trueLongitude * radiansPerDegree));
        rightAscension = (rightAscension + 360) % 360;

        const longitudeQuadrant = Math.floor(trueLongitude / 90) * 90;
        const rightAscensionQuadrant = Math.floor(rightAscension / 90) * 90;
        rightAscension = (rightAscension + longitudeQuadrant - rightAscensionQuadrant) / 15;

        const sineDeclination = 0.39782 * Math.sin(trueLongitude * radiansPerDegree);
        const cosineDeclination = Math.cos(Math.asin(sineDeclination));
        const cosineHourAngle = (Math.cos(90.833 * radiansPerDegree) -
            sineDeclination * Math.sin(latitude * radiansPerDegree)) /
            (cosineDeclination * Math.cos(latitude * radiansPerDegree));

        if (cosineHourAngle > 1 || cosineHourAngle < -1) {
            return null;
        }

        const hourAngle = (isSunrise
            ? 360 - degreesPerRadian * Math.acos(cosineHourAngle)
            : degreesPerRadian * Math.acos(cosineHourAngle)) / 15;
        const universalTime = ((hourAngle + rightAscension -
            0.06571 * approximateTime - 6.622 - longitudeHour) % 24 + 24) % 24;
        const utcMinutes = Math.round(universalTime * 60);

        return new Date(Date.UTC(
            date.getFullYear(), date.getMonth(), date.getDate(), 0, utcMinutes
        ));
    }

    return {
        sunrise: calculate(true),
        sunset: calculate(false)
    };
}

let locationCoordinates = null;
let lastSunRefreshPeriod = "";

function setSunArcStatus(message) {
    const button = document.getElementById("toggle_arc");
    if (button) {
        button.title = message;
    }
}

function updateSunTimes(date = new Date()) {
    if (!locationCoordinates) {
        return false;
    }

    const { sunrise, sunset } = getSunTimes(
        locationCoordinates.latitude,
        locationCoordinates.longitude,
        date
    );

    if (!sunrise || !sunset) {
        document.getElementById("sunArc").setAttribute("d", "");
        setSunArcStatus("Sunrise/sunset arc is unavailable at this location today");
        console.warn("Sunrise/sunset times are unavailable at this location today.");
        return false;
    }

    updateSunArc(sunrise, sunset);
    setSunArcStatus("Toggle Sunrise & Sunset Arc");
    return true;
}

function initializeSunTimes() {
    if (!navigator.geolocation) {
        setSunArcStatus("Sunrise/sunset arc requires browser location access");
        console.warn("Geolocation is not available; sunrise/sunset arc remains unavailable.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        position => {
            locationCoordinates = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude
            };
            updateSunTimes();
        },
        error => {
            setSunArcStatus("Sunrise/sunset arc unavailable: location permission was not granted");
            console.warn("Unable to determine location for the sunrise/sunset arc.", error);
        },
        { maximumAge: 3600000, timeout: 10000 }
    );
}

function updateSunArc(sunrise, sunset) {
    const center = 512;
    const radius = 344;
    const sunriseHours = sunrise.getHours() + sunrise.getMinutes() / 60;
    const sunsetHours = sunset.getHours() + sunset.getMinutes() / 60;
    const sunriseAngle = sunriseHours * 15;
    const sunsetAngle = sunsetHours * 15;

    function polarToCartesian(angle) {
        const radians = (angle - 90) * Math.PI / 180;
        return {
            x: center + radius * Math.cos(radians),
            y: center + radius * Math.sin(radians)
        };
    }

    const start = polarToCartesian(sunriseAngle);
    const end = polarToCartesian(sunsetAngle);
    const daylightHours = (sunsetHours - sunriseHours + 24) % 24;
    const largeArc = daylightHours > 12 ? 1 : 0;
    const path = `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArc} 1 ${end.x} ${end.y}`;

    document.getElementById("sunArc").setAttribute("d", path);
}

function checkTime(value) {
    return String(value).padStart(2, "0");
}

function updateClock(now = new Date()) {
    const dateText = `${MONTHS[now.getMonth()]}·${checkTime(now.getDate())}·${DAYS[now.getDay()]}`;
    const timeText = `${checkTime(now.getHours())}:${checkTime(now.getMinutes())}:${checkTime(now.getSeconds())}`;
    document.getElementById("dat").innerHTML = `${dateText}<br><br><br>${timeText}`;

    const secondsSinceMidnight = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    const rotation = (secondsSinceMidnight * 360 / 86400).toFixed(3);
    for (let index = 1; index <= 10; index++) {
        const hand = document.getElementById(`hand${index}`);
        if (hand) {
            hand.setAttribute("transform", `rotate(${rotation} 512 512)`);
        }
    }

    const refreshPeriod = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${now.getHours() < 12 ? 0 : 12}`;
    if (refreshPeriod !== lastSunRefreshPeriod) {
        lastSunRefreshPeriod = refreshPeriod;
        mp(now);
        if (locationCoordinates) {
            updateSunTimes(now);
        }
    }
}

function startClock() {
    function tick() {
        updateClock();
        window.setTimeout(tick, 1000 - Date.now() % 1000);
    }
    tick();
}

function rc() {
    const red = Math.floor(Math.random() * 256);
    const green = Math.floor(Math.random() * 256);
    const blue = Math.floor(Math.random() * 256);
    return `rgb(${red}, ${green}, ${blue})`;
}

function mp(date = new Date()) {
    const julianDay = Math.floor(date.getTime() / MILLISECONDS_PER_DAY + 2440587.5);
    const phaseDay = ((julianDay - NEW_MOON_JULIAN_DAY) % LUNAR_CYCLE_DAYS + LUNAR_CYCLE_DAYS) % LUNAR_CYCLE_DAYS;
    const phase = MOON_PHASE_BOUNDS.findIndex(bound => phaseDay < bound);
    const selectedPhase = phase === -1 ? 0 : phase;

    for (let index = 0; index < MOON_PHASE_BOUNDS.length; index++) {
        const moon = document.getElementById(`moon${index + 1}`);
        if (moon) {
            moon.style.display = index === selectedPhase ? "inline" : "none";
        }
    }
}

const THEMES = {
    hand: {
        select: "hand_style", property: "display", visible: "inline", hidden: "none",
        options: {
            hand_modern: "hand1", hand_classic: "hand2", hand_block: "hand3",
            hand_gothic: "hand4", hand_tech: "hand5", hand_babylonian: "hand6",
            hand_ray: "hand7", hand_mayan: "hand8", hand_military: "hand9", hand_LCD: "hand10"
        }
    },
    mn: {
        select: "mn_style", container: "mn", property: "opacity", visible: "1", hidden: "0",
        options: { mn_modern: "mn1", mn_classic: "mn2", mn_block: "mn3", mn_gothic: "mn4", mn_babylonian: "mn5" }
    },
    am: {
        select: "am_style", container: "am", property: "opacity", visible: "1", hidden: "0",
        options: {
            am_modern: "am1", am_classic: "am2", am_block: "am3", am_gothic: "am4",
            am_unary: "am5", am_babylonian: "am6", am_ray: "am7", am_mayan: "am8",
            am_military: "am9", am_LCD: "am10"
        }
    },
    pm: {
        select: "pm_style", container: "pm", property: "opacity", visible: "1", hidden: "0",
        options: {
            pm_modern: "pm1", pm_classic: "pm2", pm_block: "pm3", pm_gothic: "pm4",
            pm_unary: "pm5", pm_babylonian: "pm6", pm_ray: "pm7", pm_mayan: "pm8",
            pm_military: "pm9", pm_lcd: "pm10", pm_lcda: "pm10a"
        }
    },
    sixty: {
        select: "sixty_style", container: "sixty", property: "opacity", visible: "1", hidden: "0",
        options: { sixty_modern: "sixty1", sixty_classic: "sixty2", sixty_block: "sixty3", sixty_tech: "sixty4", sixty_ray: "sixty5", sixty_lcd: "sixty6" }
    },
    thirty: {
        select: "thirty_style", container: "thirty", property: "opacity", visible: "1", hidden: "0",
        options: { thirty_modern: "thirty1", thirty_classic: "thirty2", thirty_block: "thirty3", thirty_tech: "thirty4", thirty_ray: "thirty5", thirty_lcd: "thirty6" }
    },
    fifteen: {
        select: "fifteen_style", container: "fifteen", property: "opacity", visible: "1", hidden: "0",
        options: { fifteen_modern: "fifteen1", fifteen_classic: "fifteen2", fifteen_block: "fifteen3", fifteen_tech: "fifteen4", fifteen_ray: "fifteen5", fifteen_lcd: "fifteen6" }
    }
};

function applyTheme(name) {
    const theme = THEMES[name];
    const selectedId = theme.options[document.getElementById(theme.select).value];
    if (!selectedId) {
        return;
    }

    if (theme.container) {
        document.getElementById(theme.container).style.opacity = theme.visible;
    }
    for (const id of Object.values(theme.options)) {
        const element = document.getElementById(id);
        if (element) {
            element.style[theme.property] = id === selectedId ? theme.visible : theme.hidden;
        }
    }
}

function hand_theme() { applyTheme("hand"); }
function mn_theme() { applyTheme("mn"); }
function am_theme() { applyTheme("am"); }
function pm_theme() { applyTheme("pm"); }
function sixty_theme() { applyTheme("sixty"); }
function thirty_theme() { applyTheme("thirty"); }
function fifteen_theme() { applyTheme("fifteen"); }

function toggleLayer(elementId, buttonId) {
    const element = document.getElementById(elementId);
    const button = document.getElementById(buttonId);
    const isVisible = element.style.opacity !== "0";
    element.style.opacity = isVisible ? "0" : "1";
    button.style.background = isVisible ? "" : "black";
}

function face_toggle() { toggleLayer("face", "face_button"); }
function dat_toggle() { toggleLayer("dat", "dat_button"); }
function mn_toggle() { toggleLayer("mn", "mn_button"); }
function am_toggle() { toggleLayer("am", "am_button"); }
function am0_toggle() { toggleLayer("am0", "am0_button"); }
function pm_toggle() { toggleLayer("pm", "pm_button"); }
function pm0_toggle() { toggleLayer("pm0", "pm0_button"); }
function sixty_toggle() { toggleLayer("sixty", "sixty_button"); }
function thirty_toggle() { toggleLayer("thirty", "thirty_button"); }
function fifteen_toggle() { toggleLayer("fifteen", "fifteen_button"); }
function cd_toggle() { toggleLayer("cd", "cd_button"); }
function moon_toggle() { toggleLayer("moon", "moon_button"); }
function sun_toggle() { toggleLayer("sun", "sun_button"); }
function arc_toggle() { toggleLayer("arc", "arc_button"); }

async function tfs() {
    try {
        if (document.fullscreenElement) {
            await document.exitFullscreen();
        } else {
            await document.documentElement.requestFullscreen();
        }
    } catch (error) {
        console.error("Unable to toggle fullscreen mode.", error);
    }
}

function toggle_arc() {
    const arc = document.getElementById("arc");
    arc.style.display = arc.style.display === "none" ? "block" : "none";
}

function setDigitalFontWeight(weight) {
    document.getElementById("dat").style.fontWeight = String(weight);
}

function type_black() { setDigitalFontWeight(900); }
function type_bold() { setDigitalFontWeight(500); }
function type_regular() { setDigitalFontWeight(400); }
function type_light() { setDigitalFontWeight(200); }

window.addEventListener("load", () => {
    mp();
    startClock();
    initializeSunTimes();
}, { once: true });
</script>
